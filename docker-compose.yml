services:
  postgres:
    image: postgres:17
    container_name: retail_erp_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: retail_erp_db
      POSTGRES_USER: retail_erp_user
      POSTGRES_PASSWORD: retail_erp_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: retail_erp_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
